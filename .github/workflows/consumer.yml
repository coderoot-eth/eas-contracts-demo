# A consumer's check before calling the demo contracts: reads a release run's record and checks each
# contract's code hash, read from the chain now, is live in the CodeRoot index. Holds no key.
name: consumer

on:
  workflow_dispatch:
    inputs:
      release-run:
        description: ID of the release run whose contracts to check
        required: true

permissions: {}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    env:
      RPC_URL: ${{ vars.BASE_SEPOLIA_RPC_URL || 'https://sepolia.base.org' }}
      OUT: ${{ github.workspace }}/consumer-out
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: release
          run-id: ${{ inputs.release-run }}
          github-token: ${{ github.token }}
      - uses: foundry-rs/foundry-toolchain@dba66c27052e63476d886f22216e119ba7e615bf # v1.9.2
        with:
          version: v1.8.7
      - name: Check before calling
        run: demo/consumer.sh release/release.json
      - name: Summary
        if: always()
        run: |
          [ -f "$OUT/consumer.json" ] || exit 0
          {
            echo "## Consumer check"
            echo "| contract | address | verdict |"
            echo "|---|---|---|"
            jq -r '.contracts[] | "| \(.role) | `\(.address)` | \(.verdict) |"' "$OUT/consumer.json"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: consumer
          path: consumer-out/
